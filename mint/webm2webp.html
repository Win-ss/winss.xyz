<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebM to WebP</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <meta name="description" content="Turn a WebM or MP4 clip into an animated WebP, right in your browser." />
  <meta property="og:title" content="WebM to WebP" />
  <meta property="og:description" content="Turn a WebM or MP4 clip into an animated WebP, right in your browser." />
  <meta property="og:image" content="https://winss.xyz/assets/favicon.png" />
  <meta property="og:url" content="https://winss.xyz/mint/webm2webp.html" />
  <meta name="theme-color" content="#3ddc97" />
  <link rel="stylesheet" href="base.css" />
  <style>
    .wrap { max-width: 30rem; }

    .drop {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px dashed var(--line);
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .drop:hover, .drop.over { border-color: var(--mint); border-style: solid; }
    .drop.over { background: rgba(10, 74, 51, 0.35); }
    .drop .big { font-size: 0.95rem; }
    .drop .small { font-size: 0.68rem; color: var(--text-muted); }

    .stage {
      width: 100%;
      border: 1px solid var(--line);
      background: #000;
      position: relative;
    }

    .stage video, .stage img {
      display: block;
      width: 100%;
      max-height: 18rem;
      object-fit: contain;
      background: #000;
    }

    .stage .tag {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 0.6rem;
      padding: 0.15rem 0.45rem;
      background: #000;
      color: var(--text-muted);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      pointer-events: none;
    }

    .stage.result { border-color: var(--mint-dark); }
    .stage.result .tag { color: var(--mint-light); border-color: var(--mint-dark); }

    .meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: -0.6rem;
    }

    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 1rem;
    }

    .grid label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.6rem;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      text-align: left;
    }

    .grid label b {
      font-weight: normal;
      display: flex;
      justify-content: space-between;
    }

    .grid label b em { font-style: normal; color: var(--mint-light); }

    input[type="number"] {
      font: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      outline: none;
      padding: 0.35rem 0.1rem;
      width: 100%;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"]:focus { border-bottom-color: var(--mint); }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 1.7rem;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
    input[type="range"]::-moz-range-track { height: 1px; background: var(--line); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      margin-top: -4.5px;
      background: var(--mint);
      border: 0;
      border-radius: 0;
    }
    input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; background: var(--mint); border: 0; border-radius: 0; }
    input[type="range"]:hover::-webkit-slider-thumb { background: var(--mint-light); }
    input[type="range"]:hover::-moz-range-thumb { background: var(--mint-light); }

    .full { grid-column: 1 / -1; }

    .row { display: flex; gap: 0.75rem; width: 100%; }
    .row .btn { flex: 1; }

    #go { width: 100%; max-width: 14rem; }

    .work {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.75rem;
      color: var(--text-soft);
    }

    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="frost" aria-hidden="true"></div>
  <main class="wrap">
    <h1 class="tagline"><a href="./">webm → webp</a></h1>

    <div class="drop" id="drop" role="button" tabindex="0" aria-label="choose a video">
      <p class="big">drop a video</p>
      <p class="small">webm, mp4 or mov · or click to pick one</p>
    </div>
    <input type="file" id="file" accept="video/*" hidden />

    <div class="stage hidden" id="source">
      <video id="video" controls muted playsinline preload="auto"></video>
      <span class="tag">source</span>
    </div>
    <div class="meta hidden" id="meta">
      <span id="info"></span>
      <button type="button" class="link" id="remove" style="font-size: inherit">remove</button>
    </div>

    <div class="grid hidden" id="opts">
      <label>
        <b>from (s)</b>
        <input type="number" id="from" min="0" step="0.1" value="0" inputmode="decimal" />
      </label>
      <label>
        <b>to (s)</b>
        <input type="number" id="to" min="0.1" step="0.1" value="5" inputmode="decimal" />
      </label>
      <label>
        <b>scale <em id="scale-v">100%</em></b>
        <input type="range" id="scale" min="10" max="100" step="10" value="100" />
      </label>
      <label>
        <b>fps <em id="fps-v">12</em></b>
        <input type="range" id="fps" min="5" max="30" step="1" value="12" />
      </label>
      <label class="full">
        <b>quality <em id="quality-v">80</em></b>
        <input type="range" id="quality" min="10" max="100" step="5" value="80" />
      </label>
    </div>

    <button type="button" class="btn hidden" id="go">make webp</button>

    <div class="work hidden" id="work" aria-live="polite">
      <div id="throb"></div>
      <span id="step">reading frames</span>
      <div id="bar"></div>
    </div>

    <div class="stage result hidden" id="result">
      <img id="out" alt="animated webp result" />
      <span class="tag" id="size"></span>
    </div>
    <div class="row hidden" id="actions">
      <button type="button" class="btn" id="save">save webp</button>
      <button type="button" class="btn ghost" id="copy">copy</button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="foot"><a href="./">← mint</a> · nothing leaves your device</p>
  </main>

  <canvas id="canvas" hidden></canvas>

  <script>
    // Animated WebP muxer: takes still WebP frames from canvas and wraps them in VP8X + ANIM + ANMF chunks.
    function concat(...parts) {
      const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let off = 0;
      for (const p of parts) { out.set(p, off); off += p.length; }
      return out;
    }
    const u32 = (v) => new Uint8Array([v & 0xff, (v >> 8) & 0xff, (v >> 16) & 0xff, (v >>> 24) & 0xff]);
    const ascii = (s) => new TextEncoder().encode(s);
    const tagOf = (b, o) => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);

    function chunk(tag, data) {
      return concat(ascii(tag), u32(data.length), data, data.length % 2 ? new Uint8Array(1) : new Uint8Array(0));
    }

    function readChunks(buf) {
      if (tagOf(buf, 0) !== 'RIFF' || tagOf(buf, 8) !== 'WEBP') throw new Error('frame is not webp');
      const out = [];
      for (let o = 12; o + 8 <= buf.length;) {
        const size = buf[o + 4] | (buf[o + 5] << 8) | (buf[o + 6] << 16) | (buf[o + 7] << 24);
        if (o + 8 + size > buf.length) break;
        out.push({ tag: tagOf(buf, o), data: buf.subarray(o + 8, o + 8 + size) });
        o += 8 + size + (size & 1);
      }
      return out;
    }

    function put24(arr, at, v) { arr[at] = v & 0xff; arr[at + 1] = (v >> 8) & 0xff; arr[at + 2] = (v >> 16) & 0xff; }

    function buildWebP(w, h, frames) {
      const vp8x = new Uint8Array(10);
      vp8x[0] = 0x12; // animation + alpha
      put24(vp8x, 4, w - 1);
      put24(vp8x, 7, h - 1);
      const parts = [chunk('VP8X', vp8x), chunk('ANIM', new Uint8Array(6))]; // black bg, loop forever
      for (const f of frames) {
        const body = concat(...readChunks(f.buf).filter((c) => !['VP8X', 'ICCP', 'EXIF', 'XMP '].includes(c.tag)).map((c) => chunk(c.tag, c.data)));
        const anmf = new Uint8Array(16 + body.length);
        put24(anmf, 6, w - 1);
        put24(anmf, 9, h - 1);
        put24(anmf, 12, Math.round(f.ms));
        anmf[15] = 0x01; // dispose to background, no blending
        anmf.set(body, 16);
        parts.push(chunk('ANMF', anmf));
      }
      const all = concat(...parts);
      return new Blob([concat(ascii('RIFF'), u32(all.length + 4), ascii('WEBP'), all)], { type: 'image/webp' });
    }
  </script>
  <script src="ui.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const $drop = $('drop'), $file = $('file'), $video = $('video');
    const $from = $('from'), $to = $('to');
    const $scale = $('scale'), $fps = $('fps'), $quality = $('quality');
    const $go = $('go'), $work = $('work'), $step = $('step');
    const $out = $('out'), $size = $('size'), $status = $('status');
    const canvas = $('canvas');
    const ctx = canvas.getContext('2d');

    let src = null, result = null, resultUrl = null, busy = false;

    // Safari's canvas can't write webp (it silently returns png), so check before promising anything
    const canWebP = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 1;
      return c.toDataURL('image/webp').startsWith('data:image/webp');
    })();

    function setStatus(text, kind) {
      $status.textContent = text || '';
      $status.className = 'status' + (kind ? ' ' + kind : '');
    }

    function show(ids, on) { ids.forEach((id) => $(id).classList.toggle('hidden', !on)); }

    function load(f) {
      if (!f || busy) return;
      if (!/^video\//.test(f.type) && !/\.(webm|mp4|mov|mkv|ogv)$/i.test(f.name)) return setStatus("that's not a video", 'error');
      if (src) URL.revokeObjectURL(src);
      src = URL.createObjectURL(f);
      $video.src = src;
      setStatus('');
      $video.onloadedmetadata = () => {
        const d = $video.duration, w = $video.videoWidth, h = $video.videoHeight;
        if (!w || !h) return setStatus("couldn't read that video", 'error');
        const g = (a, b) => (b ? g(b, a % b) : a);
        $('info').textContent = (isFinite(d) ? d.toFixed(2) + 's · ' : '') + w + '×' + h + ' · ' + w / g(w, h) + ':' + h / g(w, h);
        $from.value = '0';
        $from.max = $to.max = isFinite(d) ? d.toFixed(1) : '';
        $to.value = (isFinite(d) ? Math.min(5, d) : 5).toFixed(1);
        show(['drop'], false);
        show(['source', 'meta', 'opts', 'go'], true);
        clearResult();
        if (!canWebP) setStatus("this browser can't encode webp, try chrome or firefox", 'error');
      };
      $video.onerror = () => setStatus("couldn't play that video here", 'error');
    }

    function clearResult() {
      show(['result', 'actions'], false);
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = null;
      result = null;
    }

    $('remove').addEventListener('click', () => {
      if (busy) return;
      if (src) URL.revokeObjectURL(src);
      src = null;
      $video.removeAttribute('src');
      $video.load();
      $file.value = '';
      clearResult();
      show(['source', 'meta', 'opts', 'go'], false);
      show(['drop'], true);
      setStatus('');
    });

    $scale.addEventListener('input', () => { $('scale-v').textContent = $scale.value + '%'; });
    $fps.addEventListener('input', () => { $('fps-v').textContent = $fps.value; });
    $quality.addEventListener('input', () => { $('quality-v').textContent = $quality.value; });

    function clampTrim() {
      const d = isFinite($video.duration) ? $video.duration : Infinity;
      let a = Math.max(0, parseFloat($from.value) || 0);
      let b = Math.min(d, parseFloat($to.value) || 0);
      if (a >= d) a = Math.max(0, d - 0.1);
      if (b < a + 0.1) b = Math.min(d, a + 0.1);
      return [a, b];
    }
    [$from, $to].forEach((el) => el.addEventListener('change', () => {
      const [a, b] = clampTrim();
      $from.value = a.toFixed(1);
      $to.value = b.toFixed(1);
    }));

    // seek and wait for the frame; setting the same time again never fires "seeked", which used to hang the job
    function seek(t) {
      return new Promise((resolve) => {
        if (Math.abs($video.currentTime - t) < 0.001 && $video.readyState >= 2) return resolve();
        const done = () => { clearTimeout(timer); $video.removeEventListener('seeked', done); resolve(); };
        const timer = setTimeout(done, 3000);
        $video.addEventListener('seeked', done);
        $video.currentTime = t;
      });
    }

    const toBlob = (q) => new Promise((res) => canvas.toBlob(res, 'image/webp', q));

    $go.addEventListener('click', async () => {
      if (!src || busy) return;
      if (!canWebP) return setStatus("this browser can't encode webp, try chrome or firefox", 'error');
      busy = true;
      $go.disabled = true;
      clearResult();
      setStatus('');
      show(['work'], true);
      const stop = mintUI.comet($('throb'));
      const setBar = mintUI.bar($('bar'), 20);
      setBar(0);

      const [start, end] = clampTrim();
      const fps = +$fps.value;
      const scale = +$scale.value / 100;
      const quality = +$quality.value / 100;
      const total = Math.max(1, Math.ceil((end - start) * fps));
      const w = Math.max(1, Math.round($video.videoWidth * scale));
      const h = Math.max(1, Math.round($video.videoHeight * scale));
      canvas.width = w;
      canvas.height = h;

      try {
        $video.pause();
        const frames = [];
        for (let i = 0; i < total; i++) {
          await seek(Math.min(start + i / fps, end));
          ctx.drawImage($video, 0, 0, w, h);
          const blob = await toBlob(quality);
          if (!blob) throw new Error('frame encode failed');
          frames.push({ buf: new Uint8Array(await blob.arrayBuffer()), ms: 1000 / fps });
          $step.textContent = 'frame ' + (i + 1) + ' / ' + total;
          setBar((i + 1) / total * 0.95);
        }
        $step.textContent = 'stitching';
        await new Promise((r) => setTimeout(r, 30)); // let the label paint before the blocking mux
        result = buildWebP(w, h, frames);
        setBar(1);
        resultUrl = URL.createObjectURL(result);
        $out.src = resultUrl;
        $size.textContent = 'webp · ' + w + '×' + h + ' · ' + (result.size / 1024).toFixed(1) + ' kb';
        show(['result', 'actions'], true);
        $('actions').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        setStatus(frames.length + ' frames at ' + fps + ' fps', 'ok');
      } catch (err) {
        console.error(err);
        setStatus('conversion failed: ' + (err.message || err), 'error');
      } finally {
        stop();
        show(['work'], false);
        busy = false;
        $go.disabled = false;
      }
    });

    $('save').addEventListener('click', () => {
      if (result) mintUI.save(result, 'animation-' + Date.now() + '.webp');
    });

    $('copy').addEventListener('click', async () => {
      if (!result) return;
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/webp': result })]);
        setStatus('copied', 'ok');
      } catch {
        setStatus("clipboard won't take webp here, save it instead", 'error');
      }
    });

    $drop.addEventListener('click', () => $file.click());
    $drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $file.click(); } });
    $file.addEventListener('change', () => load($file.files[0]));

    let depth = 0;
    addEventListener('dragenter', (e) => { e.preventDefault(); depth++; $drop.classList.add('over'); });
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $drop.classList.remove('over'); } });
    addEventListener('drop', (e) => {
      e.preventDefault();
      depth = 0;
      $drop.classList.remove('over');
      load(e.dataTransfer && e.dataTransfer.files[0]);
    });
  </script>
  <script src="bg.js" defer></script>
</body>
</html>
