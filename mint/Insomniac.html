<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Insomniac</title>
  <link rel="icon" type="image/png" href="../assets/insomniac.png" />
  <link rel="apple-touch-icon" href="../assets/insomniac.png" />
  <meta name="description" content="Keep your screen awake while this page is open." />
  <meta property="og:title" content="Insomniac" />
  <meta property="og:description" content="Keep your screen awake while this page is open." />
  <meta property="og:image" content="https://winss.xyz/assets/insomniac.png" />
  <meta property="og:url" content="https://winss.xyz/mint/Insomniac.html" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Insomniac" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="base.css" />
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .eye {
      display: grid;
      grid-template-columns: repeat(7, 8px);
      gap: 3px;
      margin-bottom: 0.4rem;
    }

    .eye i { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.1); }
    .eye i.on { background: var(--mint); }
    .awake .eye i.on { animation: blink 6s steps(1) infinite; }

    /* every so often the eye shuts for a moment */
    @keyframes blink {
      0%, 96% { opacity: 1; }
      97%, 99% { opacity: 0; }
    }

    .state { font-size: 0.85rem; color: var(--text-soft); }
    .awake .state { color: var(--mint-light); }
    .how { font-size: 0.65rem; color: var(--text-faint); min-height: 1em; margin-top: -0.6rem; }

    .foot { cursor: default; }
    .foot .link { font-size: inherit; }

    .blackout {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      display: none;
    }

    .blackout.on { display: block; }

    .blackout::after {
      content: '';
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 3px;
      height: 3px;
      background: var(--mint-deep);
    }
  </style>
</head>
<body>
  <main class="wrap" id="wrap">
    <div class="eye" id="eye" aria-hidden="true"></div>
    <h1 class="tagline">insomniac</h1>
    <p class="state" id="state" aria-live="polite">tap anywhere to keep the screen on</p>
    <p class="how" id="how"></p>
    <p class="foot">
      <a href="./">← mint</a>
      · <button type="button" class="link" id="dark">blackout</button>
      <span id="install-wrap" hidden>· <button type="button" class="link" id="install">install</button></span>
    </p>
  </main>
  <div class="blackout" id="blackout" title="double tap to leave"></div>

  <script>
    const $wrap = document.getElementById('wrap');
    const $state = document.getElementById('state');
    const $how = document.getElementById('how');
    const $blackout = document.getElementById('blackout');

    // 7x5 pixel eye
    const EYE = ['..###..', '.#...#.', '#..#..#', '.#...#.', '..###..'].join('');
    document.getElementById('eye').append(...[...EYE].map((c) => {
      const i = document.createElement('i');
      if (c === '#') i.className = 'on';
      return i;
    }));

    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    // iOS web apps added to the home screen accept a wake lock but don't honor it (fixed in 18.4),
    // so iOS always gets the silent video too
    const needVideo = isIOS || !('wakeLock' in navigator);

    let lock = null;
    let video = null;

    function render() {
      const viaLock = lock && !lock.released;
      const viaVideo = video && !video.paused;
      const on = viaLock || viaVideo;
      $wrap.classList.toggle('awake', on);
      $state.textContent = on ? 'screen stays on while this is open'
        : document.visibilityState !== 'visible' ? 'paused while hidden'
        : 'tap anywhere to keep the screen on';
      $how.textContent = on ? [viaLock && 'wake lock', viaVideo && 'video loop'].filter(Boolean).join(' + ') : '';
    }

    function makeVideo() {
      const v = document.createElement('video');
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.loop = true;
      v.setAttribute('muted', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('aria-hidden', 'true');
      Object.assign(v.style, { position: 'fixed', left: '0', top: '0', width: '1px', height: '1px', opacity: '0.01', pointerEvents: 'none' });
      for (const [src, type] of [['../assets/keepawake.webm', 'video/webm'], ['../assets/keepawake.mp4', 'video/mp4']]) {
        const s = document.createElement('source');
        s.src = src;
        s.type = type;
        v.appendChild(s);
      }
      v.addEventListener('playing', render);
      v.addEventListener('pause', render);
      document.body.appendChild(v);
      return v;
    }

    // play() has to be called straight from the tap on iOS, so this stays synchronous up to the call
    function startVideo() {
      if (!video) video = makeVideo();
      if (!video.paused) return;
      const p = video.play();
      if (p) p.catch(render);
    }

    async function startLock() {
      if (!('wakeLock' in navigator) || (lock && !lock.released)) return;
      try {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; render(); });
      } catch {
        // no gesture yet, low battery mode, or blocked by the browser; fall back to the video
        lock = null;
        // muted video is allowed to autoplay nearly everywhere
        if (document.visibilityState === 'visible') startVideo();
      }
      render();
    }

    function wake() {
      if (document.visibilityState !== 'visible') return;
      if (needVideo) startVideo();
      startLock();
    }

    // try straight away (Chrome allows it), and again on every tap or key until something sticks
    wake();
    for (const ev of ['pointerdown', 'touchend', 'keydown']) {
      document.addEventListener(ev, () => {
        if ((lock && !lock.released) || (video && !video.paused)) return;
        wake();
      }, { passive: true });
    }

    // the browser drops the lock and pauses media when the tab is hidden; take it back on return
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        startLock();
        if (video && video.paused && (needVideo || !lock)) startVideo();
      }
      render();
    });
    addEventListener('pageshow', wake);

    // blackout: plain black for OLED screens. b toggles, double tap or escape leaves.
    function setBlackout(on) { $blackout.classList.toggle('on', on); }
    document.getElementById('dark').addEventListener('click', (e) => { e.stopPropagation(); setBlackout(true); });
    $blackout.addEventListener('dblclick', () => setBlackout(false));
    let lastTap = 0;
    $blackout.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTap < 350) { e.preventDefault(); setBlackout(false); }
      lastTap = now;
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'b' && !e.ctrlKey && !e.metaKey) setBlackout(!$blackout.classList.contains('on'));
      if (e.key === 'Escape') setBlackout(false);
    });

    // install as an app when the browser offers it
    let installPrompt = null;
    const installed = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
    addEventListener('beforeinstallprompt', (e) => {
      if (installed) return;
      e.preventDefault();
      installPrompt = e;
      document.getElementById('install-wrap').hidden = false;
    });
    document.getElementById('install').addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => {});
      installPrompt = null;
      document.getElementById('install-wrap').hidden = true;
    });

    render();
  </script>
</body>
</html>
