<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF to PNG</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <meta name="description" content="Turn every page of a PDF into a PNG, right in your browser." />
  <meta property="og:title" content="PDF to PNG" />
  <meta property="og:description" content="Turn every page of a PDF into a PNG, right in your browser." />
  <meta property="og:image" content="https://winss.xyz/assets/favicon.png" />
  <meta property="og:url" content="https://winss.xyz/mint/pdf2png.html" />
  <meta name="theme-color" content="#3ddc97" />
  <link rel="stylesheet" href="base.css" />
  <style>
    .square {
      width: 100%;
      max-width: 22rem;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.55);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .square.pick { cursor: pointer; border-style: dashed; }
    .square.pick:hover, .square.over { border-color: var(--mint); border-style: solid; }
    .square.over { background: rgba(10, 74, 51, 0.35); }

    .square .big { font-size: 0.95rem; color: var(--text); }
    .square .small { font-size: 0.68rem; color: var(--text-muted); }
    .square .count { margin: 0.7rem 0 0.5rem; }

    .doc {
      width: 30px;
      height: 38px;
      border: 2px solid var(--text-faint);
      position: relative;
      margin: 0 auto 0.9rem;
    }

    .doc::before {
      content: '';
      position: absolute;
      left: 5px;
      right: 5px;
      top: 7px;
      height: 2px;
      background: var(--text-faint);
      box-shadow: 0 6px 0 var(--text-faint), 0 12px 0 var(--text-faint), 0 18px 0 var(--mint-dark);
    }

    .square.pick:hover .doc, .square.over .doc { border-color: var(--mint); }

    .pages {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 10px;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: var(--mint-dark) transparent;
    }

    .pages::-webkit-scrollbar { width: 4px; }
    .pages::-webkit-scrollbar-thumb { background: var(--mint-dark); }

    .pages button {
      font: inherit;
      font-size: 0.6rem;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--line);
      padding: 4px 4px 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
      transition: border-color 0.12s ease, color 0.12s ease;
    }

    .pages button:hover { border-color: var(--mint); color: var(--mint-light); }
    .pages img { width: 100%; display: block; background: #fff; }

    .row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 22rem;
      justify-content: center;
    }

    .row .btn { flex: 1; padding-left: 0.5rem; padding-right: 0.5rem; }

    .opt {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.6rem;
      color: var(--text-muted);
      align-items: center;
    }

    .cycle {
      font: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      min-width: 6.5rem;
    }

    .cycle:hover { color: var(--mint-light); border-bottom-color: var(--mint); }
    .cycle:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="frost" aria-hidden="true"></div>
  <main class="wrap">
    <h1 class="tagline"><a href="./">pdf → png</a></h1>

    <div class="square pick" id="square" role="button" tabindex="0" aria-label="choose a pdf">
      <div id="empty" class="empty">
        <div class="doc"></div>
        <p class="big">drop a pdf</p>
        <p class="small">or click to pick one</p>
      </div>
      <div id="work" class="hidden">
        <div id="throb"></div>
        <p class="small count" id="count"></p>
        <div id="bar"></div>
      </div>
      <div id="pages" class="pages hidden"></div>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" hidden />

    <label class="opt">
      resolution
      <button type="button" class="cycle" id="dpi">300 dpi</button>
    </label>

    <div class="row hidden" id="actions">
      <button type="button" class="btn" id="save">save all</button>
      <button type="button" class="btn ghost" id="again">another pdf</button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="foot"><a href="./">← mint</a> · nothing leaves your device</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="ui.js"></script>
  <script>
    const $square = document.getElementById('square');
    const $empty = document.getElementById('empty');
    const $work = document.getElementById('work');
    const $pages = document.getElementById('pages');
    const $count = document.getElementById('count');
    const $file = document.getElementById('file');
    const $dpi = document.getElementById('dpi');
    const $actions = document.getElementById('actions');
    const $save = document.getElementById('save');
    const $again = document.getElementById('again');
    const $status = document.getElementById('status');

    const DPIS = [150, 300, 600];
    let dpiIdx = 1;
    let results = [];
    let file = null;
    let name = 'document';
    let busy = false;

    function setStatus(text, kind) {
      $status.textContent = text || '';
      $status.className = 'status' + (kind ? ' ' + kind : '');
    }

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    } else {
      setStatus('could not load the pdf reader, check your connection and reload', 'error');
    }

    function show(which) {
      $empty.classList.toggle('hidden', which !== 'empty');
      $work.classList.toggle('hidden', which !== 'work');
      $pages.classList.toggle('hidden', which !== 'pages');
      $square.classList.toggle('pick', which === 'empty');
      $square.setAttribute('tabindex', which === 'empty' ? '0' : '-1');
      $actions.classList.toggle('hidden', which !== 'pages');
    }

    function clear() {
      results.forEach((r) => URL.revokeObjectURL(r.url));
      results = [];
      $pages.replaceChildren();
    }

    // big pages at 600 dpi can blow past what a canvas can hold (iOS caps around 16.7 MP)
    const MAX_PIXELS = 16e6;

    async function convert(f) {
      if (busy || !window.pdfjsLib) return;
      if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') return setStatus("that's not a pdf", 'error');
      busy = true;
      file = f;
      name = f.name.replace(/\.pdf$/i, '').replace(/[^a-z0-9\-_]+/gi, '-') || 'document';
      clear();
      show('work');
      setStatus('');
      $dpi.disabled = true;
      const stop = mintUI.comet(document.getElementById('throb'));
      const setBar = mintUI.bar(document.getElementById('bar'), 18);
      setBar(0);
      $count.textContent = 'reading';
      let capped = false;
      try {
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        const total = pdf.numPages;
        for (let i = 1; i <= total; i++) {
          $count.textContent = 'page ' + i + ' / ' + total;
          const page = await pdf.getPage(i);
          let scale = DPIS[dpiIdx] / 72;
          const base = page.getViewport({ scale: 1 });
          const px = base.width * base.height * scale * scale;
          if (px > MAX_PIXELS) { scale = Math.sqrt(MAX_PIXELS / (base.width * base.height)); capped = true; }
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport }).promise;
          const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
          canvas.width = canvas.height = 0;
          page.cleanup();
          const r = { n: i, blob, url: URL.createObjectURL(blob), w: viewport.width | 0, h: viewport.height | 0 };
          results.push(r);
          addThumb(r);
          setBar(i / total);
        }
        pdf.destroy();
        show('pages');
        $save.textContent = total === 1 ? 'save png' : 'save all (.zip)';
        setStatus(total + (total === 1 ? ' page' : ' pages') + ' · ' + results[0].w + ' × ' + results[0].h
          + (capped ? ' · some pages scaled down to fit' : ''), 'ok');
      } catch (err) {
        console.error(err);
        clear();
        show('empty');
        setStatus(err && err.name === 'PasswordException' ? 'this pdf has a password, remove it and try again' : "couldn't read that pdf", 'error');
      } finally {
        stop();
        busy = false;
        $dpi.disabled = false;
      }
    }

    function addThumb(r) {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = 'save page ' + r.n;
      const img = document.createElement('img');
      img.src = r.url;
      img.alt = 'page ' + r.n;
      const cap = document.createElement('span');
      cap.textContent = 'p' + r.n + ' · ' + (r.blob.size / 1048576).toFixed(1) + ' mb';
      b.append(img, cap);
      b.addEventListener('click', () => mintUI.save(r.blob, name + '-' + r.n + '.png'));
      $pages.appendChild(b);
    }

    $save.addEventListener('click', async () => {
      if (!results.length) return;
      if (results.length === 1) return mintUI.save(results[0].blob, name + '.png');
      $save.disabled = true;
      setStatus('zipping');
      try {
        const zip = new JSZip();
        results.forEach((r) => zip.file(name + '-' + r.n + '.png', r.blob));
        mintUI.save(await zip.generateAsync({ type: 'blob', compression: 'STORE' }), name + '-png.zip');
        setStatus('saved ' + name + '-png.zip', 'ok');
      } catch (err) {
        setStatus('zip failed: ' + err.message, 'error');
      } finally {
        $save.disabled = false;
      }
    });

    $again.addEventListener('click', () => {
      clear();
      file = null;
      $file.value = '';
      show('empty');
      setStatus('');
      $file.click();
    });

    $dpi.addEventListener('click', () => {
      dpiIdx = (dpiIdx + 1) % DPIS.length;
      $dpi.textContent = DPIS[dpiIdx] + ' dpi';
      if (file && !busy) convert(file);
    });

    $square.addEventListener('click', () => { if ($square.classList.contains('pick')) $file.click(); });
    $square.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && $square.classList.contains('pick')) { e.preventDefault(); $file.click(); }
    });
    $file.addEventListener('change', () => { if ($file.files[0]) convert($file.files[0]); });

    let depth = 0;
    addEventListener('dragenter', (e) => { e.preventDefault(); depth++; $square.classList.add('over'); });
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $square.classList.remove('over'); } });
    addEventListener('drop', (e) => {
      e.preventDefault();
      depth = 0;
      $square.classList.remove('over');
      const f = e.dataTransfer && e.dataTransfer.files[0];
      if (f) convert(f);
    });
  </script>
  <script src="bg.js" defer></script>
</body>
</html>
